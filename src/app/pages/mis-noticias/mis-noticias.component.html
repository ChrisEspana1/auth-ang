<div class="container py-4">
  <h2 class="mb-4">📰 Mis Noticias y Eventos</h2>

  <div *ngIf="registros.length === 0" class="alert alert-info">
    No has creado ninguna noticia o evento aún.
  </div>

  <div *ngFor="let item of registros" class="card mb-4 shadow-sm">
    <div class="row g-0">
      <div class="col-md-4">
        <img
          [src]="item.imagen_url || 'https://via.placeholder.com/300x200?text=Sin+imagen'"
          class="img-fluid rounded-start h-100 object-fit-cover"
          alt="Imagen destacada"
        />
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{ item.titulo }}</h5>
          <p class="card-text">{{ item.descripcion }}</p>
          <p class="card-text">
            <small class="text-muted">
              <strong>Tipo:</strong> {{ item.tipo }} |
              <strong>Fecha evento:</strong> {{ item.fecha_evento || 'N/A' }} |
              <strong>Creado:</strong> {{ item.created_at | date:'medium' }}
            </small>
          </p>
          <div class="mt-3">
            <button class="btn btn-outline-primary me-2" (click)="editar(item.id)">Editar</button>
            <button class="btn btn-outline-danger" (click)="eliminar(item.id)">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav *ngIf="total > porPagina" class="d-flex justify-content-center mt-4">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="pagina === 1">
        <button class="page-link" (click)="cambiarPagina(pagina - 1)">Anterior</button>
      </li>
      <li class="page-item" [class.disabled]="pagina * porPagina >= total">
        <button class="page-link" (click)="cambiarPagina(pagina + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
</div>
