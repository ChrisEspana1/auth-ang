
<div *ngIf="mensajeExito" class="mensaje-exito">
  {{ mensajeExito }}
</div>

<h2>Gestión de Proveedores</h2>

<button (click)="mostrarFormularioNuevoProveedor = !mostrarFormularioNuevoProveedor">
  {{ mostrarFormularioNuevoProveedor ? 'Cancelar' : 'Agregar nuevo proveedor' }}
</button>

<div *ngIf="mostrarFormularioNuevoProveedor">
  <form (ngSubmit)="crearProveedor()">
    <label>Curso ID:</label>
    <input [(ngModel)]="nuevoProveedor.curso_id" name="curso_id" required />

    <label>Nombre:</label>
    <input [(ngModel)]="nuevoProveedor.nombre" name="nombre" required />

    <label>Contacto:</label>
    <input [(ngModel)]="nuevoProveedor.contacto" name="contacto" required />

    <label>Servicio:</label>
    <input [(ngModel)]="nuevoProveedor.servicio" name="servicio" required />

    <label>Tipo de contacto:</label>
    <select [(ngModel)]="nuevoProveedor.tipo_contacto" name="tipo_contacto" required>
      <option value="whatsapp">WhatsApp</option>
      <option value="email">Email</option>
    </select>

    <label>Activo:</label>
    <select [(ngModel)]="nuevoProveedor.activo" name="activo" required>
      <option [value]="1">Activo</option>
      <option [value]="0">Inactivo</option>
    </select>

    <button type="submit">Guardar</button>
  </form>
</div>

<h3>Lista de Proveedores</h3>
<table>
  <tr>
    <th>Nombre</th>
    <th>Contacto</th>
    <th>Servicio</th>
    <th>Tipo de contacto</th>
    <th>Estado</th>
    <th>Acciones</th>
  </tr>
  <tr *ngFor="let proveedor of proveedores">
    <ng-container *ngIf="editando[proveedor.id]; else vistaProveedor">
      <td><input [(ngModel)]="ediciones[proveedor.id].nombre" name="nombre{{proveedor.id}}" /></td>
      <td><input [(ngModel)]="ediciones[proveedor.id].contacto" name="contacto{{proveedor.id}}" /></td>
      <td><input [(ngModel)]="ediciones[proveedor.id].servicio" name="servicio{{proveedor.id}}" /></td>
      <td>
        <select [(ngModel)]="ediciones[proveedor.id].tipo_contacto" name="tipo_contacto{{proveedor.id}}">
          <option value="whatsapp">WhatsApp</option>
          <option value="email">Email</option>
        </select>
      </td>
      <td>
        <select [(ngModel)]="ediciones[proveedor.id].activo" name="activo{{proveedor.id}}">
          <option [value]="1">Activo</option>
          <option [value]="0">Inactivo</option>
        </select>
      </td>
      <td>
        <button (click)="guardarCambios(proveedor.id)">Guardar</button>
        <button (click)="cancelarEdicion(proveedor.id)">Cancelar</button>
      </td>
    </ng-container>
    <ng-template #vistaProveedor>
      <td>{{ proveedor.nombre }}</td>
      <td>{{ proveedor.contacto }}</td>
      <td>{{ proveedor.servicio }}</td>
      <td>{{ proveedor.tipo_contacto }}</td>
      <td>{{ proveedor.activo ? 'Activo' : 'Inactivo' }}</td>
      <td>
        <button (click)="activarEdicion(proveedor.id)">Editar</button>
      </td>
    </ng-template>
  </tr>
</table>
